<!DOCTYPE html>
<html lang="de">
<head>
  <link rel="icon" type="image/png" href="travelmate-icon.png.PNG">
<link rel="apple-touch-icon" href="travelmate-icon.png.PNG">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TravelMate">
  <section class="account-card">
  <div>
    <h2>👤 Mein Account</h2>
    <p id="accountStatus">Noch nicht angemeldet</p>
  </div>

  <button onclick="openAccount()">
    Anmelden
  </button>
</section>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>TravelMate</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>✈️ TravelMate</h1>
    <p>Deine Reise. Einfacher.</p>
  </header>

  <main>

    <section class="card">
      <h2>💱 Währungsrechner</h2>

      <input
        type="number"
        id="amount"
        placeholder="Betrag eingeben"
      >

<select id="fromCurrency">
  <option value="">Währungen werden geladen...</option>
</select>

<select id="toCurrency">
  <option value="">Währungen werden geladen...</option>
</select>

<button onclick="convertCurrency()">
  Umrechnen
</button>

<h3 id="currencyResult">
  Ergebnis erscheint hier
</h3>


    <section class="card">
      <h2>✈️ Anschlussrechner</h2>

      <label>Ankunftszeit</label>

      <input
        type="time"
        id="arrivalTime"
      >

      <label>Abflugzeit</label>

      <input
        type="time"
        id="departureTime"
      >

      <button onclick="calculateConnection()">
        Anschluss prüfen
      </button>

      <h3 id="connectionResult">
        Gib deine Flugzeiten ein
      </h3>
    </section>


    <section class="card">
      <h2>💰 Reisebudget</h2>

      <input
        type="number"
        id="flight"
        placeholder="Flugkosten €"
      >

      <input
        type="number"
        id="hotel"
        placeholder="Unterkunft €"
      >

      <input
        type="number"
        id="food"
        placeholder="Essen €"
      >

      <input
        type="number"
        id="transport"
        placeholder="Transport €"
      >

      <button onclick="calculateBudget()">
        Budget berechnen
      </button>

      <h3 id="budgetResult">
        Dein Reisebudget
      </h3>

    </section>

  </main>

  <script src="script.js"></script>
<div id="accountModal" class="modal">

  <div class="modal-content">

    <button class="close-button" onclick="closeAccount()">
      ×
    </button>

    <h2>👤 TravelMate Account</h2>

    <div id="loginArea">

      <input
        type="email"
        id="email"
        placeholder="E-Mail-Adresse"
      >

      <input
        type="password"
        id="password"
        placeholder="Passwort"
      >

      <button onclick="createAccount()">
        Account erstellen
      </button>

      <button
        class="secondary-button"
        onclick="login()">
        Anmelden
      </button>

      <p id="accountMessage"></p>

    </div>

    <div id="loggedInArea" style="display:none;">

      <h3>Willkommen bei TravelMate! ✈️</h3>

      <p id="loggedInEmail"></p>

      <button onclick="logout()">
        Abmelden
      </button>

    </div>

  </div>

</div>
</body>
</html>
